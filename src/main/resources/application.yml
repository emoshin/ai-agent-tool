server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: ai-agent-tool
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_agent_tool}
    username: ${DB_USERNAME:ai_agent}
    password: ${DB_PASSWORD:ai_agent_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  security:
    jwt-secret: ${APP_JWT_SECRET:dev-only-jwt-secret-change-in-production-minimum-32-bytes-long}
    jwt-expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
    token-encryption-key: ${APP_TOKEN_ENCRYPTION_KEY:dev-only-aes-key-change-in-production-32bytes}
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
