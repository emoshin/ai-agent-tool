spring:
  datasource:
    url: jdbc:h2:mem:ai_agent_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  seed:
    enabled: true
  security:
    jwt-secret: test-jwt-secret-key-at-least-32-bytes-long-for-hmac-sha256
    jwt-expiration-ms: 3600000
    token-encryption-key: test-aes-256-encryption-key-material-for-unit-tests
